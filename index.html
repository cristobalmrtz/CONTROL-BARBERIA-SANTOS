<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbería Santos — Control de Caja</title>
<style>
:root{
  --gold:#c9a24b;
  --gold-dim:#8a7238;
  --ink:#1a1714;
  --paper:#faf7f2;
  --card:#ffffff;
  --line:#e7e0d4;
  --muted:#8a8578;
  --green:#2e7d4f;
  --red:#b23b3b;
  --blue:#2f6fa3;
  --radius:14px;
  --bg:var(--paper);
  --fg:var(--ink);
  --card-bg:var(--card);
  --border:var(--line);
  --muted-fg:var(--muted);
  --shadow:0 1px 3px rgba(20,15,5,.06), 0 1px 2px rgba(20,15,5,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210;
    --fg:#f1ece1;
    --card-bg:#1e1b17;
    --border:#332e26;
    --muted-fg:#9c9587;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#141210;
  --fg:#f1ece1;
  --card-bg:#1e1b17;
  --border:#332e26;
  --muted-fg:#9c9587;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%;
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--fg);
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
header.app{
  position:sticky; top:0; z-index:20;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:linear-gradient(135deg,#1a1714,#2b241a);
  color:#f4ead0;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
}
header.app .brand{display:flex; align-items:center; gap:10px;}
header.app .brand .logo{
  width:34px;height:34px;border-radius:50%;
  background:var(--gold); color:#1a1714;
  display:flex;align-items:center;justify-content:center;
  font-size:18px; font-weight:700; flex:none;
}
header.app h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.2px;}
header.app .sub{font-size:11px; color:#cbb98a; margin-top:1px;}
header.app button.icon{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  color:#f4ead0; border-radius:10px; padding:8px 10px; font-size:16px;
  line-height:1;
}
main{
  flex:1; overflow-y:auto; padding:14px 14px calc(90px + env(safe-area-inset-bottom,0px));
  max-width:640px; width:100%; margin:0 auto;
}
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--card-bg);
  border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:space-around;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);
}
nav.tabs button{
  background:none; border:none; display:flex; flex-direction:column; align-items:center;
  gap:2px; color:var(--muted-fg); font-size:10.5px; padding:6px 4px; border-radius:10px;
  flex:1; max-width:110px;
}
nav.tabs button .ic{font-size:19px;}
nav.tabs button.active{color:var(--gold-dim); font-weight:700;}
:root[data-theme="dark"] nav.tabs button.active,
@media (prefers-color-scheme:dark){ nav.tabs button.active{color:var(--gold);} }

h2.view-title{font-size:16px; margin:2px 0 12px; font-weight:700;}
.card{
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted-fg); margin:0 0 8px; font-weight:700;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--border); background:var(--bg); color:var(--fg);
  padding:10px 14px; border-radius:999px; font-size:13.5px; font-weight:600;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.chip.selected{background:var(--gold); border-color:var(--gold); color:#1a1714;}
.chip .price{display:block; font-size:11px; font-weight:500; opacity:.8;}
label.field-label{display:block; font-size:12px; font-weight:600; color:var(--muted-fg); margin:12px 0 6px;}
input[type=text],input[type=number],input[type=date],input[type=month],textarea,select{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--bg); color:var(--fg); font-size:14.5px; font-family:inherit;
}
textarea{resize:vertical; min-height:54px;}
.btn{
  display:block; width:100%; padding:13px; border-radius:12px; border:none;
  font-size:15px; font-weight:700; cursor:pointer; text-align:center;
}
.btn-primary{background:var(--gold); color:#1a1714;}
.btn-primary:active{filter:brightness(.95);}
.btn-ghost{background:transparent; border:1.5px solid var(--border); color:var(--fg);}
.btn-danger-ghost{background:transparent;border:1.5px solid var(--red); color:var(--red); font-weight:600; font-size:12.5px; padding:6px 10px; border-radius:8px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.hint{font-size:11.5px; color:var(--muted-fg); margin-top:6px;}
.list-item{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;
}
.list-item:last-child{border-bottom:none;}
.list-item .meta{color:var(--muted-fg); font-size:11.5px;}
.list-item .amt{font-weight:700; white-space:nowrap;}
.amt.pos{color:var(--green);}
.amt.neg{color:var(--red);}
.empty{color:var(--muted-fg); font-size:13px; text-align:center; padding:18px 4px;}
.subtabs{display:flex; gap:8px; margin-bottom:12px;}
.subtabs button{
  flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--border); background:var(--card-bg);
  color:var(--fg); font-size:13px; font-weight:700;
}
.subtabs button.active{background:#1a1714; color:#f4ead0; border-color:#1a1714;}
@media (prefers-color-scheme:dark){ .subtabs button.active{background:var(--gold); color:#1a1714; border-color:var(--gold);} }
:root[data-theme="dark"] .subtabs button.active{background:var(--gold); color:#1a1714; border-color:var(--gold);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px;}
.stat .lbl{font-size:11px; color:var(--muted-fg); font-weight:600; margin-bottom:4px;}
.stat .val{font-size:18px; font-weight:800;}
.stat.wide{grid-column:1/-1;}
table.mini{width:100%; border-collapse:collapse; font-size:13px;}
table.mini th{text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted-fg); padding:4px 6px; border-bottom:1.5px solid var(--border);}
table.mini td{padding:7px 6px; border-bottom:1px solid var(--border);}
table.mini tr:last-child td{border-bottom:none;}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:12px;}
.bar-row .lbl{width:82px; flex:none; color:var(--muted-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{flex:1; height:9px; background:var(--border); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; background:var(--gold);}
.bar-val{width:64px; flex:none; text-align:right; font-weight:700;}
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:60;
  background:#1a1714; color:#f4ead0; padding:10px 18px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  background:var(--card-bg); width:100%; max-width:640px; border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px)); max-height:80vh; overflow-y:auto;
}
.modal h3{margin:0 0 12px; font-size:15px;}
.small-note{font-size:11.5px; color:var(--muted-fg); line-height:1.5;}
.badge{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--border); color:var(--muted-fg);}
.offline-banner{
  background:#8a5a1c; color:#fff; font-size:12px; text-align:center; padding:7px; font-weight:600;
}
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <div class="logo">💈</div>
    <div>
      <h1>Barbería Santos</h1>
      <div class="sub" id="dateHeader">Control de caja</div>
    </div>
  </div>
  <button class="icon" id="btnSettings" aria-label="Ajustes">⚙️</button>
</header>

<div id="offlineBanner" class="offline-banner" style="display:none;">Sin conexión con el servidor — los datos no se están guardando</div>

<main id="main"></main>

<nav class="tabs">
  <button data-tab="registrar" class="active"><span class="ic">✂️</span>Cortes</button>
  <button data-tab="gastos"><span class="ic">💸</span>Gastos</button>
  <button data-tab="vales"><span class="ic">🎟️</span>Vales</button>
  <button data-tab="cierres"><span class="ic">📊</span>Cierres</button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — edita este valor antes de publicar
   ============================================================ */

// Pega aquí la URL de tu Web App de Google Apps Script (termina en /exec)
const GAS_URL = "https://script.google.com/macros/s/AKfycbwXhODGUK_R7vcb4qL7_LJBkSvpc9hDCJT-Jce9iMdZjL9NjG_ZR87v8UCh9WxPe_JD/exec";

// Debe ser IDÉNTICO al valor TOKEN que pongas en el código de Apps Script
const SHOP_CODE = "santos2026";

/* ============================================================ */

function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowTimeStr(){const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-CO',{maximumFractionDigits:0});
}
function fmtDateHuman(str){
  if(!str) return '';
  const [y,m,d] = str.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('es-CO',{weekday:'short', day:'2-digit', month:'short'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function startOfWeek(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const day = dt.getDay(); // 0 Sun - 6 Sat
  const diff = (day===0? -6 : 1-day); // move to Monday
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function addDays(dt,n){const d=new Date(dt); d.setDate(d.getDate()+n); return d;}
function toISO(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}

/* ---------------- state ---------------- */
const DEFAULT_CONFIG = {
  precios: {
    promo: {label:'Promoción (L-V 9:30-14:00)', valor:16000},
    normal: {label:'Corte normal', valor:22000},
    barbero: {label:'Cliente del barbero', valor:20000},
  },
  medios: ['Efectivo','Nequi','Otro'],
  categoriasGasto: ['Insumos','Arriendo','Servicios','Publicidad','Otro'],
};

const state = {
  tab: 'registrar',
  cierreSub: 'diario',
  config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
  configLoaded: false,
  db: null,
  ventasHoy: [],
  gastosHoy: [],
  valesHoy: [],
  form: {
    corte: {servicio:null, precioCustom:'', medio:null, cliente:'', descuento:'', observacion:''},
    gasto: {categoria:null, descripcion:'', medio:null, valor:'', responsable:'', observacion:''},
    vale: {descripcion:'', valor:'', medio:null},
  },
  cierre: {
    fecha: todayStr(),
    weekAnchor: todayStr(),
    month: (function(){const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1);})(),
    data: null,
    loading: false,
  }
};

/* ---------------- backend: Google Sheets (Apps Script) ---------------- */
function genId(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }

async function gasGet(action, params={}){
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', SHOP_CODE);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}
async function gasPost(payload){
  const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify({...payload, token: SHOP_CODE})});
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}

async function initDb(){
  if(GAS_URL.indexOf('PON_AQUI')===0){
    document.getElementById('offlineBanner').style.display = 'block';
    document.getElementById('offlineBanner').textContent = 'Falta configurar GAS_URL al inicio del código con la URL de tu Web App de Google Sheets.';
    state.configLoaded = true;
    render();
    return;
  }
  state.db = true; // marca que el backend está configurado
  try{
    const {config} = await gasGet('config');
    if(config){
      state.config = deepMerge(DEFAULT_CONFIG, config);
    } else {
      await gasPost({action:'setConfig', config: DEFAULT_CONFIG});
      state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }
  }catch(e){
    document.getElementById('offlineBanner').style.display = 'block';
    document.getElementById('offlineBanner').textContent = 'No se pudo conectar con Google Sheets: ' + e.message;
  }
  state.configLoaded = true;
  render();
  subscribeToday();
  setInterval(subscribeToday, 20000);
}

function deepMerge(base, override){
  const out = JSON.parse(JSON.stringify(base));
  for(const k in override){
    if(override[k] && typeof override[k]==='object' && !Array.isArray(override[k])){
      out[k] = deepMerge(base[k]||{}, override[k]);
    } else {
      out[k] = override[k];
    }
  }
  return out;
}

async function subscribeToday(){
  if(!state.db) return;
  const t = todayStr();
  try{
    const [v,g,va] = await Promise.all([
      gasGet('range', {sheet:'Ventas', start:t, end:t}),
      gasGet('range', {sheet:'Gastos', start:t, end:t}),
      gasGet('range', {sheet:'Vales', start:t, end:t}),
    ]);
    state.ventasHoy = (v.rows||[]).sort((a,b)=>(b.ts||0)-(a.ts||0));
    state.gastosHoy = (g.rows||[]).sort((a,b)=>(b.ts||0)-(a.ts||0));
    state.valesHoy = (va.rows||[]).sort((a,b)=>(b.ts||0)-(a.ts||0));
    render();
  }catch(e){ /* silencioso: se reintenta en el siguiente sondeo */ }
}

/* ---------------- rendering ---------------- */
function el(html){const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild;}

function render(){
  document.getElementById('dateHeader').textContent = new Date().toLocaleDateString('es-CO',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(!state.configLoaded){
    main.appendChild(el(`<div class="empty">Cargando…</div>`));
    return;
  }
  if(state.tab==='registrar') renderRegistrar(main);
  else if(state.tab==='gastos') renderGastos(main);
  else if(state.tab==='vales') renderVales(main);
  else if(state.tab==='cierres') renderCierres(main);
}

/* ---- Registrar corte ---- */
function servicioPrecio(key){
  if(key==='custom') return Number(state.form.corte.precioCustom)||0;
  const p = state.config.precios[key];
  return p? p.valor : 0;
}
function renderRegistrar(main){
  const f = state.form.corte;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="section-label">Servicio</div>`));
  const servRow = el(`<div class="chip-row"></div>`);
  Object.entries(state.config.precios).forEach(([key,p])=>{
    const chip = el(`<button type="button" class="chip ${f.servicio===key?'selected':''}">${p.label}<span class="price">${fmtMoney(p.valor)}</span></button>`);
    chip.onclick = ()=>{ f.servicio=key; render(); };
    servRow.appendChild(chip);
  });
  const customChip = el(`<button type="button" class="chip ${f.servicio==='custom'?'selected':''}">Personalizado</button>`);
  customChip.onclick = ()=>{ f.servicio='custom'; render(); };
  servRow.appendChild(customChip);
  card.appendChild(servRow);

  if(f.servicio==='custom'){
    const inp = el(`<input type="number" inputmode="numeric" placeholder="Valor del corte" value="${f.precioCustom}">`);
    inp.oninput = e=>{ f.precioCustom = e.target.value; };
    const wrap = el(`<div></div>`); wrap.appendChild(el(`<label class="field-label">Valor personalizado</label>`)); wrap.appendChild(inp);
    card.appendChild(wrap);
  }

  card.appendChild(el(`<div class="section-label" style="margin-top:16px;">Medio de pago</div>`));
  const medioRow = el(`<div class="chip-row"></div>`);
  state.config.medios.forEach(m=>{
    const chip = el(`<button type="button" class="chip ${f.medio===m?'selected':''}">${m}</button>`);
    chip.onclick = ()=>{ f.medio=m; render(); };
    medioRow.appendChild(chip);
  });
  card.appendChild(medioRow);

  const row2 = el(`<div class="row" style="margin-top:14px;"></div>`);
  const clienteWrap = el(`<div></div>`);
  clienteWrap.appendChild(el(`<label class="field-label">Cliente (opcional)</label>`));
  const clienteInp = el(`<input type="text" placeholder="Nombre / referencia" value="${f.cliente}">`);
  clienteInp.oninput = e=>{ f.cliente = e.target.value; };
  clienteWrap.appendChild(clienteInp);
  const descWrap = el(`<div></div>`);
  descWrap.appendChild(el(`<label class="field-label">Descuento (opcional)</label>`));
  const descInp = el(`<input type="number" inputmode="numeric" placeholder="0" value="${f.descuento}">`);
  descInp.oninput = e=>{ f.descuento = e.target.value; };
  descWrap.appendChild(descInp);
  row2.appendChild(clienteWrap); row2.appendChild(descWrap);
  card.appendChild(row2);

  const precio = servicioPrecio(f.servicio);
  const descuento = Number(f.descuento)||0;
  const valorRecibido = Math.max(precio - descuento, 0);

  const summary = el(`<div class="stat wide" style="margin-top:14px;">
    <div class="lbl">Valor a cobrar</div>
    <div class="val">${fmtMoney(valorRecibido)}</div>
  </div>`);
  card.appendChild(summary);

  const btn = el(`<button class="btn btn-primary" style="margin-top:14px;">Registrar corte</button>`);
  const canSave = f.servicio && f.medio && (f.servicio!=='custom' || Number(f.precioCustom)>0);
  if(!canSave) btn.style.opacity='.5';
  btn.onclick = async ()=>{
    if(!canSave) return;
    btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      await gasPost({action:'add', sheet:'Ventas', data:{
        id: genId(),
        fecha: todayStr(), hora: nowTimeStr(),
        servicio: state.config.precios[f.servicio]? state.config.precios[f.servicio].label : 'Personalizado',
        precio: precio,
        medioPago: f.medio,
        cliente: f.cliente||'',
        descuento: descuento,
        valorRecibido: valorRecibido,
        observacion: f.observacion||'',
        ts: Date.now(),
      }});
      toast('Corte registrado ✓');
      state.form.corte = {servicio:null, precioCustom:'', medio:f.medio, cliente:'', descuento:'', observacion:''};
      subscribeToday();
    }catch(e){
      toast('No se pudo guardar');
    }
    render();
  };
  card.appendChild(btn);
  main.appendChild(card);

  // hoy list
  const listCard = el(`<div class="card"></div>`);
  const totalHoy = state.ventasHoy.reduce((s,v)=>s+(Number(v.valorRecibido)||0),0);
  listCard.appendChild(el(`<div class="section-label">Hoy · ${state.ventasHoy.length} cortes · <span style="color:var(--green)">${fmtMoney(totalHoy)}</span></div>`));
  if(state.ventasHoy.length===0){
    listCard.appendChild(el(`<div class="empty">Aún no hay cortes registrados hoy</div>`));
  } else {
    state.ventasHoy.forEach(v=>{
      const item = el(`<div class="list-item">
        <div>
          <div>${v.servicio}</div>
          <div class="meta">${v.hora||''} · ${v.medioPago}${v.cliente? ' · '+v.cliente:''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="amt pos">${fmtMoney(v.valorRecibido)}</div>
          <button class="btn-danger-ghost" data-del="${v.id}" data-col="ventas">✕</button>
        </div>
      </div>`);
      item.querySelector('[data-del]').onclick = ()=>confirmDelete('ventas', v.id, 'este corte');
      listCard.appendChild(item);
    });
  }
  main.appendChild(listCard);
}

/* ---- Gastos ---- */

/* ---- Cierres ---- */
function renderCierres(main){
  const sub = el(`<div class="subtabs"></div>`);
  [['diario','Diario'],['semanal','Semanal'],['mensual','Mensual']].forEach(([k,label])=>{
    const b = el(`<button class="${state.cierreSub===k?'active':''}">${label}</button>`);
    b.onclick = ()=>{ state.cierreSub=k; state.cierre.data=null; render(); loadCierre(); };
    sub.appendChild(b);
  });
  main.appendChild(sub);

  const pickerCard = el(`<div class="card"></div>`);
  if(state.cierreSub==='diario'){
    pickerCard.appendChild(el(`<label class="field-label">Fecha</label>`));
    const inp = el(`<input type="date" value="${state.cierre.fecha}">`);
    inp.onchange = e=>{ state.cierre.fecha=e.target.value; state.cierre.data=null; render(); loadCierre(); };
    pickerCard.appendChild(inp);
  } else if(state.cierreSub==='semanal'){
    pickerCard.appendChild(el(`<label class="field-label">Cualquier día de la semana a consultar</label>`));
    const inp = el(`<input type="date" value="${state.cierre.weekAnchor}">`);
    inp.onchange = e=>{ state.cierre.weekAnchor=e.target.value; state.cierre.data=null; render(); loadCierre(); };
    pickerCard.appendChild(inp);
    const wStart = startOfWeek(state.cierre.weekAnchor);
    const wEnd = addDays(wStart,6);
    pickerCard.appendChild(el(`<div class="hint">Semana: ${fmtDateHuman(toISO(wStart))} — ${fmtDateHuman(toISO(wEnd))}</div>`));
  } else {
    pickerCard.appendChild(el(`<label class="field-label">Mes</label>`));
    const inp = el(`<input type="month" value="${state.cierre.month}">`);
    inp.onchange = e=>{ state.cierre.month=e.target.value; state.cierre.data=null; render(); loadCierre(); };
    pickerCard.appendChild(inp);
  }
  main.appendChild(pickerCard);

  if(state.cierre.loading){
    main.appendChild(el(`<div class="empty">Calculando cierre…</div>`));
    return;
  }
  if(!state.cierre.data){
    loadCierre();
    main.appendChild(el(`<div class="empty">Calculando cierre…</div>`));
    return;
  }
  renderCierreResult(main, state.cierre.data);
}

function getRangeForCierre(){
  if(state.cierreSub==='diario'){
    return {start: state.cierre.fecha, end: state.cierre.fecha, label: fmtDateHuman(state.cierre.fecha)};
  } else if(state.cierreSub==='semanal'){
    const wStart = startOfWeek(state.cierre.weekAnchor);
    const wEnd = addDays(wStart,6);
    return {start: toISO(wStart), end: toISO(wEnd), label: fmtDateHuman(toISO(wStart))+' — '+fmtDateHuman(toISO(wEnd))};
  } else {
    const [y,m] = state.cierre.month.split('-').map(Number);
    const start = y+'-'+pad(m)+'-01';
    const lastDay = new Date(y, m, 0).getDate();
    const end = y+'-'+pad(m)+'-'+pad(lastDay);
    const label = new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'long', year:'numeric'});
    return {start, end, label};
  }
}

let loadToken = 0;
async function loadCierre(){
  if(!state.db) return;
  const myToken = ++loadToken;
  state.cierre.loading = true;
  const {start, end} = getRangeForCierre();
  try{
    const [v,g,va] = await Promise.all([
      gasGet('range', {sheet:'Ventas', start, end}),
      gasGet('range', {sheet:'Gastos', start, end}),
      gasGet('range', {sheet:'Vales', start, end}),
    ]);
    if(myToken !== loadToken) return; // stale
    const ventas = v.rows||[];
    const gastos = g.rows||[];
    const vales = va.rows||[];
    state.cierre.data = computeCierre(ventas, gastos, vales, start, end);
  }catch(e){
    if(myToken !== loadToken) return;
    state.cierre.data = {error:true};
  }
  state.cierre.loading = false;
  render();
}

function computeCierre(ventas, gastos, vales, start, end){
  const sum = (arr,field)=>arr.reduce((s,x)=>s+(Number(x[field])||0),0);
  const byMedio = (arr,field,medio)=>arr.filter(x=>x.medioPago===medio).reduce((s,x)=>s+(Number(x[field])||0),0);

  const ventasTotal = sum(ventas,'valorRecibido');
  const ventasEfectivo = byMedio(ventas,'valorRecibido','Efectivo');
  const ventasOtro = ventasTotal - ventasEfectivo;

  const gastosTotal = sum(gastos,'valor');
  const gastosEfectivo = byMedio(gastos,'valor','Efectivo');
  const gastosOtro = gastosTotal - gastosEfectivo;

  const valesTotal = sum(vales,'valor');
  const valesEfectivo = byMedio(vales,'valor','Efectivo');
  const valesOtro = valesTotal - valesEfectivo;

  const cajaEsperada = ventasEfectivo - gastosEfectivo - valesEfectivo;
  const resultadoNeto = ventasTotal - gastosTotal - valesTotal;

  // por servicio
  const servicioMap = {};
  ventas.forEach(v=>{
    const k = v.servicio||'—';
    if(!servicioMap[k]) servicioMap[k] = {cantidad:0, ingresos:0};
    servicioMap[k].cantidad++;
    servicioMap[k].ingresos += Number(v.valorRecibido)||0;
  });

  // por día (para semanal/mensual)
  const diaMap = {};
  ventas.forEach(v=>{
    diaMap[v.fecha] = (diaMap[v.fecha]||0) + (Number(v.valorRecibido)||0);
  });
  const dias = Object.keys(diaMap).sort();
  const maxDia = dias.reduce((m,d)=> diaMap[d]>diaMap[m||d]? d : (m||d), null);

  return {
    start, end,
    cortesCount: ventas.length,
    ventasTotal, ventasEfectivo, ventasOtro,
    gastosTotal, gastosEfectivo, gastosOtro,
    valesTotal, valesEfectivo, valesOtro,
    cajaEsperada, resultadoNeto,
    servicioMap, diaMap, maxDia,
  };
}

function renderCierreResult(main, d){
  if(d.error){
    main.appendChild(el(`<div class="empty">No se pudo calcular el cierre. Intenta de nuevo.</div>`));
    return;
  }
  const range = getRangeForCierre();

  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="section-label">${range.label}</div>`));
  const grid = el(`<div class="stat-grid"></div>`);
  grid.appendChild(el(`<div class="stat"><div class="lbl">Ingresos totales</div><div class="val" style="color:var(--green)">${fmtMoney(d.ventasTotal)}</div></div>`));
  grid.appendChild(el(`<div class="stat"><div class="lbl">Gastos</div><div class="val" style="color:var(--red)">${fmtMoney(d.gastosTotal)}</div></div>`));
  grid.appendChild(el(`<div class="stat wide"><div class="lbl">Resultado neto</div><div class="val">${fmtMoney(d.resultadoNeto)}</div></div>`));
  grid.appendChild(el(`<div class="stat"><div class="lbl">Cortes realizados</div><div class="val">${d.cortesCount}</div></div>`));
  grid.appendChild(el(`<div class="stat"><div class="lbl">Caja esperada (efectivo)</div><div class="val">${fmtMoney(d.cajaEsperada)}</div></div>`));
  card.appendChild(grid);
  main.appendChild(card);

  const medioCard = el(`<div class="card"></div>`);
  medioCard.appendChild(el(`<div class="section-label">Ingresos por medio de pago</div>`));
  medioCard.appendChild(el(`<table class="mini">
    <tr><th>Medio</th><th style="text-align:right;">Ventas</th></tr>
    <tr><td>Efectivo</td><td style="text-align:right;">${fmtMoney(d.ventasEfectivo)}</td></tr>
    <tr><td>Nequi / otro</td><td style="text-align:right;">${fmtMoney(d.ventasOtro)}</td></tr>
  </table>`));
  medioCard.appendChild(el(`<div class="section-label" style="margin-top:14px;">Gastos por medio de pago</div>`));
  medioCard.appendChild(el(`<table class="mini">
    <tr><th>Medio</th><th style="text-align:right;">Gastos</th></tr>
    <tr><td>Efectivo</td><td style="text-align:right;">${fmtMoney(d.gastosEfectivo)}</td></tr>
    <tr><td>Nequi / otro</td><td style="text-align:right;">${fmtMoney(d.gastosOtro)}</td></tr>
  </table>`));
  main.appendChild(medioCard);

  if(Object.keys(d.servicioMap).length){
    const sCard = el(`<div class="card"></div>`);
    sCard.appendChild(el(`<div class="section-label">Resumen de cortes</div>`));
    const tbl = el(`<table class="mini"><tr><th>Tipo</th><th style="text-align:center;">Cant.</th><th style="text-align:right;">Ingresos</th></tr></table>`);
    Object.entries(d.servicioMap).forEach(([nombre,info])=>{
      tbl.appendChild(el(`<tr><td>${nombre}</td><td style="text-align:center;">${info.cantidad}</td><td style="text-align:right;">${fmtMoney(info.ingresos)}</td></tr>`));
    });
    sCard.appendChild(tbl);
    main.appendChild(sCard);
  }

  if((state.cierreSub==='semanal' || state.cierreSub==='mensual') && Object.keys(d.diaMap).length){
    const dCard = el(`<div class="card"></div>`);
    dCard.appendChild(el(`<div class="section-label">Ingresos por día${d.maxDia? ' · mejor día: '+fmtDateHuman(d.maxDia):''}</div>`));
    const maxVal = Math.max(...Object.values(d.diaMap), 1);
    Object.keys(d.diaMap).sort().forEach(day=>{
      const pct = Math.round((d.diaMap[day]/maxVal)*100);
      dCard.appendChild(el(`<div class="bar-row">
        <div class="lbl">${fmtDateHuman(day)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-val">${fmtMoney(d.diaMap[day])}</div>
      </div>`));
    });
    main.appendChild(dCard);
  }

  if(d.valesTotal){
    const vCard = el(`<div class="card"></div>`);
    vCard.appendChild(el(`<div class="section-label">Vales</div>`));
    vCard.appendChild(el(`<table class="mini">
      <tr><th>Medio</th><th style="text-align:right;">Total</th></tr>
      <tr><td>Efectivo</td><td style="text-align:right;">${fmtMoney(d.valesEfectivo)}</td></tr>
      <tr><td>Nequi / otro</td><td style="text-align:right;">${fmtMoney(d.valesOtro)}</td></tr>
      <tr><td><strong>Total vales</strong></td><td style="text-align:right;"><strong>${fmtMoney(d.valesTotal)}</strong></td></tr>
    </table>`));
    main.appendChild(vCard);
  }
}

/* ---------------- delete confirm ---------------- */
function confirmDelete(col, id, label){
  const root = document.getElementById('modalRoot');
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  const modal = el(`<div class="modal">
    <h3>¿Eliminar ${label}?</h3>
    <p class="small-note">Esta acción no se puede deshacer.</p>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-ghost" id="cancelDel">Cancelar</button>
      <button class="btn" style="background:var(--red); color:#fff;" id="okDel">Eliminar</button>
    </div>
  </div>`);
  backdrop.appendChild(modal);
  backdrop.onclick = (e)=>{ if(e.target===backdrop) root.innerHTML=''; };
  modal.querySelector('#cancelDel').onclick = ()=>{ root.innerHTML=''; };
  modal.querySelector('#okDel').onclick = async ()=>{
    try{
      const sheet = col.charAt(0).toUpperCase()+col.slice(1);
      await gasPost({action:'delete', sheet, id});
      toast('Eliminado');
      subscribeToday();
    }catch(e){ toast('No se pudo eliminar'); }
    root.innerHTML='';
  };
  root.appendChild(backdrop);
}

/* ---------------- settings modal ---------------- */
function openSettings(){
  const root = document.getElementById('modalRoot');
  const c = state.config;
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  const modal = el(`<div class="modal"></div>`);
  modal.appendChild(el(`<h3>Ajustes</h3>`));

  modal.appendChild(el(`<label class="field-label">Precios de servicios</label>`));
  const priceInputs = {};
  Object.entries(c.precios).forEach(([key,p])=>{
    const row = el(`<div class="row" style="margin-bottom:8px; align-items:center;"></div>`);
    row.appendChild(el(`<div style="flex:2; font-size:13px;">${p.label}</div>`));
    const inp = el(`<input type="number" value="${p.valor}" style="flex:1;">`);
    priceInputs[key] = inp;
    row.appendChild(inp);
    modal.appendChild(row);
  });

  modal.appendChild(el(`<label class="field-label" style="margin-top:14px;">Categorías de gasto (una por línea)</label>`));
  const catTa = el(`<textarea>${c.categoriasGasto.join('\n')}</textarea>`);
  modal.appendChild(catTa);

  modal.appendChild(el(`<p class="small-note" style="margin-top:10px;">Los cambios se sincronizan para todos los que usen esta app.</p>`));

  const row = el(`<div class="row" style="margin-top:14px;"></div>`);
  const cancelBtn = el(`<button class="btn btn-ghost">Cerrar</button>`);
  const saveBtn = el(`<button class="btn btn-primary">Guardar</button>`);
  cancelBtn.onclick = ()=>{ root.innerHTML=''; };
  saveBtn.onclick = async ()=>{
    const newConfig = JSON.parse(JSON.stringify(c));
    Object.entries(priceInputs).forEach(([key,inp])=>{
      newConfig.precios[key].valor = Number(inp.value)||0;
    });
    newConfig.categoriasGasto = catTa.value.split('\n').map(s=>s.trim()).filter(Boolean);
    try{
      await gasPost({action:'setConfig', config:newConfig});
      state.config = newConfig;
      toast('Ajustes guardados');
    }catch(e){ toast('No se pudo guardar'); }
    root.innerHTML='';
  };
  row.appendChild(cancelBtn); row.appendChild(saveBtn);
  modal.appendChild(row);

  backdrop.appendChild(modal);
  backdrop.onclick = (e)=>{ if(e.target===backdrop) root.innerHTML=''; };
  root.appendChild(backdrop);
}

  b.onclick = ()=>{ state.tab = b.dataset.tab; if(state.tab==='cierres'){ state.cierre.data=null; } render(); if(state.tab==='cierres'){ loadCierre(); } };
});
document.getElementById('btnSettings').onclick = openSettings;

render();
initDb();
